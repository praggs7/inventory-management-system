<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow | Inventory Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><div><span class="eyebrow">INVENTORY CONTROL</span><h1>StockFlow</h1><p>Simple, fast product & stock management.</p></div><button class="primary" onclick="openModal()">+ Add Product</button></header>
<main>
  <section class="stats"><div><span>Products</span><strong id="products">0</strong></div><div><span>Total Units</span><strong id="units">0</strong></div><div><span>Inventory Value</span><strong id="value">₹0</strong></div><div class="warning"><span>Low Stock</span><strong id="low">0</strong></div></section>
  <section class="toolbar"><div><h2>Product Inventory</h2><p id="countText">Loading products...</p></div><input id="search" placeholder="Search ID, name or category…" oninput="loadProducts()"></section>
  <section class="tableWrap"><table><thead><tr><th>Product ID</th><th>Product</th><th>Category</th><th>Quantity</th><th>Price</th><th>Stock Status</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty">No products found. Add your first product.</div></section>
</main>
<div id="modal" class="modal"><div class="card"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Add Product</h2><form id="form"><label>Product ID<input id="pid" required></label><label>Product Name<input id="name" required></label><label>Category<input id="category" required></label><label>Quantity<input id="quantity" type="number" min="0" required></label><label>Price (₹)<input id="price" type="number" min="0" step="0.01" required></label><button class="primary" type="submit">Save Product</button></form></div></div>
<div id="toast"></div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body></html>
